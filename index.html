<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Página Web</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    color:white;
    text-align:center;
    padding:40px 20px;
}

/* MENU */
nav{
    background:#222;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    margin:10px;
    text-decoration:none;
    font-weight:bold;
}

nav a:hover{
    color:#8f94fb;
}

/* CONTENIDO */
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
    gap:20px;
}

/* TARJETAS */
.card{
    background:white;
    width:280px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    color:#4e54c8;
    margin:10px;
}

.card p{
    margin:10px;
}

/* BOTÓN */
.btn{
    display:block;
    text-align:center;
    background:#4e54c8;
    color:white;
    padding:10px;
    margin:10px;
    text-decoration:none;
    border-radius:8px;
}

.btn:hover{
    background:#2f35a0;
}

/* FOOTER */
footer{
    text-align:center;
    background:#222;
    color:white;
    padding:20px;
    margin-top:20px;
}
</style>

</head>

<body>

<header>
    <h1>Mi Página Web</h1>
    <p>Diseño moderno para tu proyecto</p>
</header>

<nav>
    <a href="#">Inicio</a>
    <a href="#">Galería</a>
    <a href="#">Contacto</a>
</nav>

<div class="container">

    <div class="card">
        <img src="https://picsum.photos/300/200?1">
        <h3>Imagen 1</h3>
        <p>Ejemplo de tarjeta moderna.</p>
        <a class="btn" href="#">Ver más</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?2">
        <h3>Imagen 2</h3>
        <p>Diseño limpio y responsive.</p>
        <a class="btn" href="#">Ver más</a>
    </div>

    <div class="card">
        <img src="https://picsum.photos/300/200?3">
        <h3>Imagen 3</h3>
        <p>Perfecto para MIT App Inventor.</p>
        <a class="btn" href="#">Ver más</a>
    </div>

</div>

<footer>
    © 2026 Mi Página Web
</footer>

</body>
</html>
