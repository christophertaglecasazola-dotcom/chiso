<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Traductor de Texto a Señas</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    text-align:center;
}

h1{
    color:#2196F3;
}

textarea{
    width:95%;
    height:120px;
    font-size:20px;
    padding:10px;
    border-radius:10px;
}

button{
    margin-top:15px;
    padding:15px 30px;
    font-size:20px;
    background:#2196F3;
    color:white;
    border:none;
    border-radius:10px;
}

#resultado{
    margin-top:20px;
    font-size:24px;
}
</style>
</head>

<body>

<h1>Traductor a Señas</h1>

<textarea
id="texto"
placeholder="Escribe aquí...">
</textarea>

<br>

<button onclick="traducir()">
Traducir
</button>

<div id="resultado"></div>

<script>
function traducir(){
    let texto =
    document.getElementById("texto").value;

    document.getElementById("resultado").innerHTML =
    texto;
}
</script>

</body>
</html>
